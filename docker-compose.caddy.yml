# Optional HTTPS front end: adds Caddy, which obtains and renews a
# certificate for FEEDFORGE_DOMAIN automatically.
#
#   echo "FEEDFORGE_DOMAIN=feeds.example.com" >> .env
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Requirements: the domain's DNS already points here, and ports 80 + 443 are
# free and reachable from the internet (both are needed for the ACME
# challenge and for redirecting http:// to https://).
services:
  feedforge:
    # Reached only through Caddy on the compose network — nothing is
    # published on the host, so the plain-HTTP port cannot be bypassed.
    ports: !reset []
    environment:
      # Overrides the base file: feed URLs must advertise the public origin,
      # not the container's own view of the request. Defaulted from the
      # domain, but an explicit FEEDFORGE_BASE_URL still wins — which is what
      # you need if CADDY_HTTPS_PORT moved the service off 443, since the port
      # has to appear in the URLs subscribers are handed.
      - FEEDFORGE_BASE_URL=${FEEDFORGE_BASE_URL:-https://${FEEDFORGE_DOMAIN:?set FEEDFORGE_DOMAIN in .env}}

  caddy:
    image: caddy:2-alpine
    container_name: feedforge-caddy
    restart: unless-stopped
    depends_on:
      - feedforge
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      - FEEDFORGE_DOMAIN=${FEEDFORGE_DOMAIN:?set FEEDFORGE_DOMAIN in .env}
      # Expands to `email you@example.com` when ACME_EMAIL is set and to
      # nothing when it isn't — an empty `email` directive is a parse error,
      # so the whole line has to appear and disappear together.
      - CADDY_GLOBAL_EXTRA=${ACME_EMAIL:+email ${ACME_EMAIL}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Keep this volume across upgrades or you will
      # re-issue certificates on every deploy and hit rate limits.
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
