# FeedForge — one-command deployment.
#
#   cp .env.example .env      # optional; do set FEEDFORGE_TOKEN if public
#   docker compose up -d      # build + start on http://localhost:8080
#
# Automatic HTTPS on your own domain (adds a Caddy front end):
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
services:
  feedforge:
    build: .
    image: feedforge:latest
    container_name: feedforge
    restart: unless-stopped
    ports:
      # Set FEEDFORGE_BIND=127.0.0.1 when a reverse proxy sits in front.
      # Docker publishes ports through its own iptables rules, which are
      # consulted before ufw/firewalld — a 0.0.0.0 publish really is
      # reachable from the internet even if your firewall says otherwise.
      - "${FEEDFORGE_BIND:-0.0.0.0}:${FEEDFORGE_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      # Protect feed creation/editing with a token (recommended when the
      # server is reachable from the internet). Feed URLs stay public.
      - FEEDFORGE_TOKEN=${FEEDFORGE_TOKEN:-}
      # Public origin behind a reverse proxy, e.g. https://feeds.example.com.
      # Set this in production so generated feed URLs don't depend on the
      # Host header of whoever asked first.
      - FEEDFORGE_BASE_URL=${FEEDFORGE_BASE_URL:-}
      # Set to "true" only if you need to scrape hosts on your own LAN.
      - FEEDFORGE_ALLOW_PRIVATE=${FEEDFORGE_ALLOW_PRIVATE:-false}
      # Max size of a fetched source page, in MB.
      - FEEDFORGE_MAX_FETCH_MB=${FEEDFORGE_MAX_FETCH_MB:-5}
    # The entrypoint needs exactly three privileges: CHOWN to adopt a
    # freshly created ./data, SETUID/SETGID for su-exec to drop to the
    # unprivileged user. The binary itself needs none of them.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # Nothing is written outside /data, so the rest of the image can be
    # sealed. Keep FEEDFORGE_DATA pointing inside the mounted volume.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    # Long enough for the 10s graceful shutdown to finish draining.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
